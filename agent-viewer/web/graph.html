<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0c0d0c">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root { --bg:#0c0d0c; --stagebg:#111311; --panel:#151815; --card:#181b18; --line:#262b26; --line2:#3a413a;
    --soft:#1c241c; --text:#e2e5df; --muted:#878e86; --idle:#4f564f; --track:#232823; --userbg:#1c241c; --inbg:#0f110f;
    --accent:#86d982;
    --s-run:#d8d2bc; --s-done:#86d982; --s-wait:#a98cf5; --s-fail:#ef5f5f; --s-alert:#ff8a3d;
    --f-ui:'Bahnschrift','DIN Alternate','DIN Condensed','Barlow Semi Condensed','Arial Narrow',sans-serif;
    --f-num:'Cascadia Mono','SF Mono',Consolas,ui-monospace,monospace; }
  :root.light { --bg:#e6e5dd; --stagebg:#efeee7; --panel:#f6f5ef; --card:#fbfaf5; --line:#d3d1c5; --line2:#b9b6a6;
    --soft:#e3ead9; --text:#1d1f1b; --muted:#6c6e64; --idle:#a3a294; --track:#dcdbd1; --userbg:#e3ead9; --inbg:#fbfaf5;
    --accent:#3f7b3b;
    --s-run:#4b4a40; --s-done:#3f7b3b; --s-wait:#6a4fc2; --s-fail:#b33434; --s-alert:#c4561e; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font:13px/1.45 var(--f-ui); }
  .app { display:grid; grid-template-rows:minmax(0,1fr) auto; gap:12px; padding:12px; height:100vh; min-height:480px; }

  /* Le plan des agents : zoom à la molette, déplacement en glissant le fond */
  .stage { position:relative; overflow:hidden; border:1px solid var(--line); border-radius:6px; background:var(--stagebg); cursor:grab; touch-action:none; }
  .stage.panning { cursor:grabbing; }
  .world { position:absolute; left:0; top:0; width:max-content; transform-origin:0 0; padding:24px; }
  .hud { position:absolute; top:10px; right:10px; display:flex; gap:6px; z-index:10; }
  .hud button, .hud span, .topleft select { background:var(--panel); border:1px solid var(--line); color:var(--muted); border-radius:3px; height:28px; padding:0 9px;
    font:500 11px var(--f-ui); text-transform:uppercase; letter-spacing:.08em; cursor:pointer; display:grid; place-items:center; }
  .hud span { cursor:default; font-family:var(--f-num); min-width:52px; }
  .hud button:hover { color:var(--text); border-color:var(--line2); }
  .topleft { position:absolute; top:10px; left:10px; display:flex; gap:8px; align-items:center; z-index:10; max-width:max(140px, calc(100% - 400px)); }
  .topleft select { display:block; max-width:100%; text-transform:none; letter-spacing:.02em; font-size:12px; color:var(--text); }
  .live { width:8px; height:8px; border-radius:1px; flex:none; background:var(--idle); }
  .live.on { background:var(--s-done); }
  .legend { position:absolute; left:12px; bottom:10px; display:flex; gap:12px; flex-wrap:wrap; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; z-index:10;
    background:color-mix(in srgb, var(--stagebg) 85%, transparent); padding:4px 8px; border-radius:3px; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:1px; margin-right:5px; background:var(--c); }
  .empty { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); text-align:center; padding:20px; white-space:pre-line; }
  .empty[hidden] { display:none; }

  /* Bulles d'agent : leur couleur suit l'état */
  .st-run, .card.st-run { --c:var(--s-run); } .st-done, .card.st-done { --c:var(--s-done); } .st-wait, .card.st-wait { --c:var(--s-wait); }
  .st-fail, .card.st-fail { --c:var(--s-fail); } .st-alert, .card.st-alert { --c:var(--s-alert); }
  .card { --c:var(--line2); position:relative; background:color-mix(in srgb, var(--c) 5%, var(--card)); border:1px solid color-mix(in srgb, var(--c) 45%, var(--line));
    border-radius:5px; padding:12px 14px; cursor:grab; transition:transform .25s ease, border-color .15s; user-select:none; }
  .card:hover { border-color:color-mix(in srgb, var(--c) 75%, var(--line)); }
  .card.sel { border-color:var(--c); box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 14%, transparent); }
  .card.dragging { cursor:grabbing; transition:none; z-index:5; box-shadow:0 10px 26px rgba(0,0,0,.45); }
  .card.open { z-index:3; }
  .card.st-alert { animation:alert 1.6s ease-in-out infinite; }
  @keyframes alert { 50% { box-shadow:0 0 0 4px color-mix(in srgb, var(--s-alert) 22%, transparent); } }
  @property --a { syntax:'<angle>'; inherits:false; initial-value:0deg; }
  .card.run::before { content:""; position:absolute; inset:-1px; border-radius:6px; padding:1.25px; pointer-events:none;
    background:conic-gradient(from var(--a), transparent 0 70%, color-mix(in srgb, var(--c) 35%, transparent) 82%, var(--c) 92%, transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
    animation:spin 2.23s linear infinite; animation-delay:var(--phase, 0s); }
  @keyframes spin { to { --a:360deg; } }
  .card.pop { animation:pop .32s ease-out, ring .6s ease-out; }
  @keyframes pop { 0% { scale:.96; } 55% { scale:1.025; } 100% { scale:1; } }
  @keyframes ring { from { box-shadow:0 0 0 0 color-mix(in srgb, var(--c) 55%, transparent); } to { box-shadow:0 0 0 16px transparent; } }
  .head { display:flex; gap:10px; align-items:center; }
  .ico { width:32px; height:32px; border-radius:3px; border:1px solid var(--line); background:var(--soft); display:grid; place-items:center; color:var(--c, var(--accent)); flex:none; font-size:15px; }
  .ttl { font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.07em; overflow-wrap:anywhere; }
  .sub { color:var(--muted); font-size:11.5px; letter-spacing:.03em; overflow-wrap:anywhere; }
  .now { margin-top:8px; font-size:11.5px; color:var(--c); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { position:absolute; top:-9px; right:10px; font-size:10.5px; padding:1px 7px; border-radius:3px; border:1px solid var(--c); color:var(--c); background:var(--bg); text-transform:uppercase; letter-spacing:.08em; }
  .bar { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .bar .t { flex:1; height:6px; background:var(--track); overflow:hidden; -webkit-mask:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 11px); mask:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 11px); }
  .bar .f { height:100%; background:var(--c, var(--accent)); transition:width .4s ease; }
  .bar .f.ind { width:35% !important; animation:slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left:-35%; } 100% { margin-left:100%; } }
  .bar .p { font-family:var(--f-num); color:var(--muted); font-size:12px; min-width:34px; text-align:right; }
  .detail { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); cursor:default; animation:unfold .28s ease-out; user-select:text; }
  @keyframes unfold { from { opacity:0; transform:translateY(-6px); } }
  .detail h4 { margin:10px 0 4px; font-size:10.5px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:.1em; }
  .detail h4:first-child { margin-top:0; }
  .detail .box { border:1px solid var(--line); border-radius:3px; padding:6px 8px; background:var(--stagebg); white-space:pre-wrap; overflow-wrap:anywhere; max-height:160px; overflow:auto; }
  .detail .warn { color:var(--s-alert); }
  .tasks { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; }
  .tasks li { display:grid; grid-template-columns:16px 1fr auto; gap:8px; align-items:center; }
  .tasks .stt { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .chk { width:12px; height:12px; border-radius:2px; border:1.5px solid var(--idle); }
  .chk.done { background:var(--s-done); border-color:var(--s-done); } .chk.now { border-color:var(--s-run); border-width:2px; animation:blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.4; } }
  svg.links { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
  svg.links path { fill:none; stroke:var(--line2); stroke-width:1.2; }
  svg.links path.live { stroke:var(--s-run); stroke-dasharray:6 6; animation:flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset:-12; } }
  .row { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 140px; gap:14px; align-items:center; }

  /* Chat, avec la progression du projet en tête et le menu Réglages */
  .chat { position:relative; border:1px solid var(--line); border-radius:5px; background:var(--panel); padding:10px 14px; display:flex; flex-direction:column; gap:8px; }
  .projrow { display:flex; align-items:center; gap:12px; }
  .projrow .lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
  .projrow .bar { flex:1; margin:0; }
  .projrow .bar .t { height:13px; -webkit-mask:repeating-linear-gradient(90deg,#000 0 12px,transparent 12px 15px); mask:repeating-linear-gradient(90deg,#000 0 12px,transparent 12px 15px); }
  .projrow .bar .p { font-size:13px; color:var(--text); }
  .dots { display:flex; gap:4px; } .dots i { width:9px; height:13px; border-radius:1px; display:block; }
  .chathead { display:flex; align-items:center; gap:14px; }
  .msgs { display:flex; flex-direction:column; gap:6px; max-height:110px; overflow:auto; }
  .msgs .none { color:var(--muted); font-size:12px; }
  .m { max-width:78%; padding:6px 10px; border-radius:4px; font-size:12.5px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .m.a { background:var(--card); border:1px solid var(--line); } .m.u { align-self:flex-end; background:var(--userbg); }
  .m .st { display:block; margin-top:3px; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .m.failed { border:1px solid var(--s-fail); } .m.failed .st { color:var(--s-fail); }
  .in { display:flex; gap:8px; }
  .in input { flex:1; background:var(--inbg); border:1px solid var(--line); border-radius:3px; color:var(--text); padding:8px 10px; font:inherit; }
  .in button { background:var(--soft); border:1px solid var(--accent); border-radius:3px; color:var(--accent); padding:0 16px; font:600 12px var(--f-ui); text-transform:uppercase; letter-spacing:.1em; cursor:pointer; }
  .in button.gear { border-color:var(--line); color:var(--muted); padding:0 11px; font-size:15px; }
  .in button.gear.on, .in button.gear:hover { color:var(--text); border-color:var(--line2); }
  .err { color:var(--s-fail); font-size:12px; }
  .err:empty { display:none; }
  .menu { position:absolute; right:14px; bottom:54px; width:250px; background:var(--panel); border:1px solid var(--line2); border-radius:5px; padding:12px;
    box-shadow:0 12px 30px rgba(0,0,0,.4); display:none; z-index:20; animation:unfold .2s ease-out; }
  .menu.open { display:block; }
  .menu h4 { margin:0 0 6px; font-size:10.5px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:.1em; }
  .menu .opts + h4 { margin-top:12px; }
  .opts { display:flex; flex-direction:column; gap:4px; } .opts.inline { flex-direction:row; }
  .opts button { text-align:left; background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:3px; padding:7px 10px; font:inherit; cursor:pointer; flex:1; }
  .opts button.on { color:var(--text); border-color:var(--accent); background:var(--soft); }
  .grip { position:absolute; left:0; right:0; top:-8px; height:14px; cursor:ns-resize; z-index:5; touch-action:none; }
  .grip::after { content:""; position:absolute; left:50%; top:5px; width:48px; height:3px; margin-left:-24px; border-radius:2px; background:var(--line2); }
  .grip:hover::after, .chat.resizing .grip::after { background:var(--muted); }
  .chat.sized .msgs { flex:1; max-height:none; }
  .status { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-left:auto; }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="world" id="world"></div>
    <div class="topleft"><span class="live" id="live"></span><select id="session"></select></div>
    <div class="hud">
      <button id="zoom-out" data-i18n-title="zoomOut">−</button><span id="zoom-val">100 %</span><button id="zoom-in" data-i18n-title="zoomIn">+</button>
      <button id="fit" data-i18n="fit" data-i18n-title="fitTitle"></button>
      <button id="reset" data-i18n="reset" data-i18n-title="resetTitle"></button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="empty" id="empty" hidden></div>
  </div>
  <div class="chat" id="chat">
    <div class="grip" id="grip" data-i18n-title="gripTitle"></div>
    <div class="projrow" id="proj"></div>
    <div class="chathead"><div class="ttl" style="font-size:12px"><span data-i18n="chatWith"></span> · <span id="who"></span></div><span class="status" id="conn"></span></div>
    <div class="msgs" id="msgs"></div>
    <div class="err" id="err"></div>
    <form class="in" id="form"><input id="input" autocomplete="off"><button type="submit" data-i18n="send"></button><button type="button" class="gear" id="gear" data-i18n-title="settings">⚙</button></form>
    <div class="menu" id="menu">
      <h4 data-i18n="layout"></h4>
      <div class="opts" data-opt="layout"><button data-val="A" data-i18n="layoutA"></button><button data-val="B" data-i18n="layoutB"></button><button data-val="C" data-i18n="layoutC"></button></div>
      <h4 data-i18n="theme"></h4>
      <div class="opts inline" data-opt="theme"><button data-val="sombre" data-i18n="dark"></button><button data-val="clair" data-i18n="light"></button></div>
      <h4 data-i18n="language"></h4>
      <div class="opts inline" data-opt="lang"><button data-val="fr">FR</button><button data-val="en">EN</button></div>
      <h4 data-i18n="app"></h4>
      <div class="opts"><button id="install" data-i18n="install" hidden></button></div>
      <div class="sub" id="install-hint"></div>
    </div>
  </div>
</div>
<script>
'use strict'
// ---------- Textes FR / EN ----------
const T = {
  fr: { zoomOut:'Dézoomer', zoomIn:'Zoomer', fit:'Ajuster', fitTitle:'Voir tous les agents', reset:'Remettre en place', resetTitle:'Remettre les bulles à leur place',
    gripTitle:"Tirer pour agrandir le chat · double-clic : taille d'origine", chatWith:'Chat', send:'Envoyer', settings:'Réglages', layout:'Disposition',
    layoutA:'Organigramme', layoutB:'Arbre horizontal', layoutC:'Tableau par lignes', theme:'Thème', dark:'Sombre', light:'Clair', language:'Langue',
    done:'Terminé', run:'En cours', wait:'En attente', fail:'Échec', stopped:'Arrêté', alert:'Alerte', project:'Projet',
    request:'Demande', final:'Réponse finale', mainAgent:'Agent principal', mainSub:'Coordonne le travail', noRequest:'Pas encore de demande',
    finWait:'En attente des agents', finReady:'Prête', finFail:'Interrompue',
    does:"Ce que fait l'agent", part:'Partie du projet', tasks:"Tâches de l'agent", action:'Action en cours', thinking:'Réflexion…',
    noTasks:"Pas encore de liste de tâches : pas de pourcentage plutôt qu'un chiffre inventé.", stale:"Liste non mise à jour : pas de pourcentage plutôt qu'un chiffre faux.",
    allSteps:'Toutes les étapes', unknownPart:'—', tDone:'Faite', tNow:'En cours', tTodo:'À faire', agentCol:'Agent', progressCol:'Avancement',
    placeholder:"Écrire à l'agent sélectionné…", noMsgs:'Pas encore de message avec cet agent.', mQueued:'En file', mSent:'Transmis', mFailed:'Refusé', mSending:'Envoi…',
    live:'En direct', reconnect:'Reconnexion…', noSession:'En attente des sessions Claude…\nLes sessions qui ont le mod agent-viewer apparaîtront ici.',
    inactive:'inactive', emptyMsg:'Écris un message avant d’envoyer.', sendFail:"L'envoi a échoué : ", requestTitle:'Ta dernière demande', finalTitle:'Réponse de l’agent principal',
    noHub:"Le hub d'agent-viewer ne répond pas.\nOuvre une session Claude Code qui a le mod : l'appli se reconnectera toute seule.",
    app:'Application', install:"Installer l'appli", installed:'Appli installée.',
    installHint:"Pour l'installer : menu du navigateur → « Installer Agents » (Chrome, Edge), ou Fichier → « Ajouter au Dock » (Safari sur Mac)." },
  en: { zoomOut:'Zoom out', zoomIn:'Zoom in', fit:'Fit', fitTitle:'Show all agents', reset:'Reset layout', resetTitle:'Put the bubbles back in place',
    gripTitle:'Drag to resize the chat · double-click: original size', chatWith:'Chat', send:'Send', settings:'Settings', layout:'Layout',
    layoutA:'Org chart', layoutB:'Horizontal tree', layoutC:'Table', theme:'Theme', dark:'Dark', light:'Light', language:'Language',
    done:'Done', run:'Running', wait:'Waiting', fail:'Failed', stopped:'Stopped', alert:'Alert', project:'Project',
    request:'Request', final:'Final answer', mainAgent:'Main agent', mainSub:'Coordinates the work', noRequest:'No request yet',
    finWait:'Waiting for the agents', finReady:'Ready', finFail:'Interrupted',
    does:'What the agent does', part:'Part of the project', tasks:"Agent's tasks", action:'Current action', thinking:'Thinking…',
    noTasks:'No task list yet: no percentage rather than a made-up number.', stale:'Task list never updated: no percentage rather than a wrong one.',
    allSteps:'All steps', unknownPart:'—', tDone:'Done', tNow:'Running', tTodo:'To do', agentCol:'Agent', progressCol:'Progress',
    placeholder:'Write to the selected agent…', noMsgs:'No messages with this agent yet.', mQueued:'Queued', mSent:'Relayed', mFailed:'Refused', mSending:'Sending…',
    live:'Live', reconnect:'Reconnecting…', noSession:'Waiting for Claude sessions…\nSessions with the agent-viewer mod will show up here.',
    inactive:'inactive', emptyMsg:'Write a message first.', sendFail:'Sending failed: ', requestTitle:'Your last request', finalTitle:"Main agent's answer",
    noHub:"The agent-viewer hub is not responding.\nOpen a Claude Code session that has the mod: the app will reconnect on its own.",
    app:'App', install:'Install the app', installed:'App installed.',
    installHint:'To install it: browser menu → "Install Agents" (Chrome, Edge), or File → "Add to Dock" (Safari on Mac).' },
}
const store = { get(k, d){ try { const v = localStorage.getItem('av-'+k); return v == null ? d : JSON.parse(v) } catch { return d } },
  set(k, v){ try { localStorage.setItem('av-'+k, JSON.stringify(v)) } catch {} } }
let lang = store.get('lang', (navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en')
const t = k => (T[lang] && T[lang][k]) ?? T.fr[k] ?? k
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c])
function applyTexts(){
  document.documentElement.lang = lang
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n) })
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle) })
  document.getElementById('input').placeholder = t('placeholder')
  document.getElementById('legend').innerHTML = ['done','run','wait','fail','alert'].map(k => `<span class="st-${k}"><i></i>${esc(t(k))}</span>`).join('')
  syncInstall()
}

// ---------- État ----------
let payload = { sessions: [] }, connected = false
let sessionId = store.get('session', null), sel = null, popId = null
let layout = store.get('layout', 'A'), theme = store.get('theme', 'sombre'), offsets = store.get('offsets', {})
const cam = { x:0, y:0, k:1 }
let needFit = true, pending = []   // messages envoyés, pas encore revenus dans l'état de la session
const MAIN = 'main'

const session = () => payload.sessions.find(s => s.id === sessionId)
const ICONS = { req:'✉', main:'◎', fin:'⇥' }
function kindIcon(a){
  const n = a.currentToolName || ''
  if (/^(Read|Grep|Glob|ToolSearch|LS)$/.test(n)) return '⌕'
  if (/^(Bash|PowerShell|Monitor)$/.test(n)) return '⚒'
  if (/^(Edit|Write|MultiEdit|NotebookEdit)$/.test(n)) return '✎'
  if (/^(WebFetch|WebSearch)$/.test(n) || /browser|chrome/i.test(n)) return '◍'
  return a.type === 'Explore' ? '⌕' : a.type === 'Plan' ? '☰' : '◆'
}

// État affiché d'un agent : alerte d'abord, puis ce que dit Claude Code
function stateOf(a){
  if (a.alert) return 'alert'
  if (a.state === 'failed' || a.status === 'failed') return 'fail'
  if (a.state === 'stopped' || a.status === 'killed') return 'stopped'
  if (a.status === 'pending' || a.status === 'waiting' || a.status === 'idle') return 'wait'
  if (a.state === 'running' || a.status === 'running') return 'run'
  return 'done'
}
const CLS = { run:'st-run', done:'st-done', wait:'st-wait', fail:'st-fail', stopped:'st-fail', alert:'st-alert' }

// % d'un agent : tâches faites ÷ total, jamais inventé
function progress(a){
  const tasks = a.tasks || []
  if (!tasks.length) return { p:null, note:'noTasks' }
  const done = tasks.filter(x => x.status === 'completed').length
  const st = stateOf(a)
  if ((st === 'done' || st === 'fail' || st === 'stopped') && (a.taskUpdates || 0) <= 1 && done < tasks.length) return { p:null, note:'stale' }
  return { p: Math.round(done / tasks.length * 100), note:null }
}

// ---------- Construction des nœuds à partir de la session ----------
function nodes(){
  const s = session(); if (!s) return null
  const agents = s.agents || []
  const main = agents.find(a => a.id === MAIN) || { id:MAIN, type:'principal', description:t('mainAgent'), state:'done', startedAt:Date.now(), toolCount:0, recentTools:[] }
  const subs = agents.filter(a => a.id !== MAIN)
  const fin = s.final || null
  const finState = !fin ? 'wait' : fin.state === 'waiting' ? 'wait' : fin.state === 'ready' ? 'done' : 'fail'
  return {
    s, main, subs,
    req: { id:'req', kind:'req', name:t('request'), sub: s.request ? s.request.text : t('noRequest'), body: s.request && s.request.text },
    fin: { id:'fin', kind:'fin', name:t('final'), sub: finState === 'wait' ? t('finWait') : finState === 'done' ? t('finReady') : t('finFail'), st: finState, body: fin && fin.text },
  }
}

// ---------- Dessin ----------
const stage = document.getElementById('stage'), world = document.getElementById('world')
const bar = (p, cls) => `<div class="bar ${cls||''}"><div class="t"><div class="f ${p==null?'ind':''}" style="width:${p??0}%"></div></div><span class="p">${p==null?'—':p+' %'}</span></div>`
const phase = () => `--phase:-${((Date.now() % 2230) / 1000).toFixed(2)}s`

function agentDetail(a, isMain){
  const pr = progress(a)
  const s = session()
  const does = isMain ? (s.request ? s.request.text : t('mainSub')) : (a.prompt || a.description)
  const now = stateOf(a) === 'run' ? (a.currentTool || t('thinking')) : null
  return `<div class="detail">
    ${a.alert ? `<h4>${esc(t('alert'))}</h4><div class="warn">${esc(a.alert)}</div>` : ''}
    <h4>${esc(t('does'))}</h4><div class="box">${esc(does)}</div>
    ${now ? `<h4>${esc(t('action'))}</h4><div>${esc(now)}</div>` : ''}
    <h4>${esc(t('part'))}</h4><div class="box">${esc(isMain ? t('allSteps') : (a.part || t('unknownPart')))}</div>
    <h4>${esc(t('tasks'))}</h4>${(a.tasks && a.tasks.length) ? `<ul class="tasks">${a.tasks.map(x => `<li><span class="chk ${x.status==='completed'?'done':x.status==='in_progress'?'now':''}"></span>
      <span>${esc(x.content)}</span><span class="stt">${esc(t(x.status==='completed'?'tDone':x.status==='in_progress'?'tNow':'tTodo'))}</span></li>`).join('')}</ul>` : ''}
    ${pr.note ? `<div class="sub" style="margin-top:6px">${esc(t(pr.note))}</div>` : ''}</div>`
}
function agentCard(a, isMain, compact){
  const st = stateOf(a), cls = CLS[st], pr = progress(a)
  const key = sessionId + ':' + layout + ':' + a.id, o = offsets[key]
  const open = sel === a.id
  const sub = isMain ? t('mainSub') : [a.type, a.model].filter(Boolean).join(' · ')
  const now = st === 'run' && !open ? (a.currentTool || t('thinking')) : st === 'alert' && !open ? a.alert : ''
  return `<div class="card ${cls} ${st==='run'||st==='alert'?'run':''} ${open?'sel open':''} ${popId===a.id?'pop':''}" data-id="${esc(a.id)}"
    style="${compact?'padding:10px 12px;':''}${o?`transform:translate(${o[0]}px,${o[1]}px);`:''}${phase()}">
    <span class="badge">${esc(t(st))}</span>
    <div class="head"><div class="ico">${isMain ? ICONS.main : kindIcon(a)}</div><div><div class="ttl">${esc(isMain ? t('mainAgent') : a.description)}</div><div class="sub">${esc(sub)}</div></div></div>
    ${now ? `<div class="now">→ ${esc(now)}</div>` : ''}
    ${bar(pr.p)}${open ? agentDetail(a, isMain) : ''}</div>`
}
function boxCard(n, compact){
  const cls = n.kind === 'fin' ? CLS[n.st] : ''
  const key = sessionId + ':' + layout + ':' + n.id, o = offsets[key], open = sel === n.id && n.body
  return `<div class="card ${cls} ${open?'sel open':''} ${popId===n.id?'pop':''}" data-id="${n.id}" style="${compact?'padding:10px 12px;':''}${o?`transform:translate(${o[0]}px,${o[1]}px);`:''}">
    <div class="head"><div class="ico">${ICONS[n.kind]}</div><div style="min-width:0"><div class="ttl">${esc(n.name)}</div><div class="sub" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(n.sub)}</div></div></div>
    ${open ? `<div class="detail"><h4>${esc(t(n.kind==='req'?'requestTitle':'finalTitle'))}</h4><div class="box">${esc(n.body)}</div></div>` : ''}</div>`
}

let pairs = []
const LAYOUTS = {
  A: n => {
    const top = n.subs.filter(a => !a.parentId || a.parentId === MAIN || !n.subs.some(b => b.id === a.parentId))
    const nested = n.subs.filter(a => !top.includes(a))
    const cols = Math.min(4, Math.max(1, n.subs.length))
    return [`<div style="display:flex;flex-direction:column;align-items:center;gap:44px">
        <div style="width:300px">${boxCard(n.req)}</div><div style="width:360px">${agentCard(n.main, true)}</div>
        ${n.subs.length ? `<div style="display:grid;grid-template-columns:repeat(${cols},250px);gap:30px 18px;align-items:start">${[...top, ...nested].map(a => agentCard(a)).join('')}</div>` : ''}
        <div style="width:300px">${boxCard(n.fin)}</div></div>`,
      [['req', MAIN], ...top.map(a => [MAIN, a.id]), ...nested.map(a => [a.parentId, a.id]), ...(n.subs.length ? top.map(a => [a.id, 'fin']) : [[MAIN, 'fin']])]]
  },
  B: n => [`<div style="display:grid;grid-template-columns:200px 240px 260px 200px;gap:46px;align-items:center">
      <div>${boxCard(n.req,1)}</div><div>${agentCard(n.main,true,1)}</div>
      <div style="display:flex;flex-direction:column;gap:16px">${n.subs.map(a => agentCard(a,false,1)).join('')}</div><div>${boxCard(n.fin,1)}</div></div>`,
    [['req',MAIN,'h'], ...n.subs.map(a => [n.subs.some(b => b.id === a.parentId) ? a.parentId : MAIN, a.id, 'h']), ...(n.subs.length ? n.subs.map(a => [a.id,'fin','h']) : [[MAIN,'fin','h']])]],
  C: n => [`<div style="display:grid;gap:10px;width:900px">
      <div class="row sub" style="padding:0 4px;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px"><span>${esc(t('agentCol'))}</span><span>${esc(t('part'))}</span><span>${esc(t('progressCol'))}</span></div>
      ${[n.main, ...n.subs].map(a => `<div class="row"><div style="${a.id!==MAIN?'padding-left:26px;border-left:2px solid var(--line);margin-left:12px':''}">${agentCard(a, a.id===MAIN, 1)}</div>
        <div class="sub">${esc(a.id===MAIN ? t('allSteps') : (a.part || '—'))}</div><div class="${CLS[stateOf(a)]}">${bar(progress(a).p)}</div></div>`).join('')}
      <div class="sub" style="margin-top:6px">${esc(t('request'))} : « ${esc(n.req.sub)} » · ${esc(t('final'))} : ${esc(n.fin.sub)}</div></div>`, []],
}

let lastSig = ''
function render(force){
  const n = nodes()
  const empty = document.getElementById('empty')
  empty.hidden = !!n; empty.textContent = n ? '' : t(connected || payload.sessions.length ? 'noSession' : 'noHub')
  if (!n){ world.innerHTML = ''; lastSig = ''; renderProject(null); renderChat(); return }
  if (drag && drag.kind === 'card') return   // pas de redessin pendant qu'on déplace une bulle
  const [html, p] = LAYOUTS[layout](n); pairs = p
  const sig = html.replace(/--phase:-[\d.]+s/g, '') + layout + lang
  if (force || sig !== lastSig){
    lastSig = sig
    world.innerHTML = `<svg class="links"></svg>${html}`
    applyCam(); drawLinks()
    // Cadrer une fois la mise en page et les polices posées
    if (needFit){ needFit = false; fit(); setTimeout(fit, 300) }
  }
  renderProject(n); renderChat()
}

// ---------- Liens ----------
function isLiveId(id){ const n = nodes(); if (!n) return false; const a = id === MAIN ? n.main : n.subs.find(x => x.id === id); return !!a && ['run','alert'].includes(stateOf(a)) }
function drawLinks(){
  const svg = world.querySelector('svg.links'); if (!svg) return
  const wr = world.getBoundingClientRect(), k = cam.k
  svg.setAttribute('width', world.offsetWidth); svg.setAttribute('height', world.offsetHeight)
  const box = id => { const el = world.querySelector(`[data-id="${CSS.escape(id)}"]`); if (!el) return null; const r = el.getBoundingClientRect()
    return { l:(r.left-wr.left)/k, t:(r.top-wr.top)/k, w:r.width/k, h:r.height/k } }
  svg.innerHTML = pairs.map(([f, to, dir]) => {
    const a = box(f), b = box(to); if (!a || !b) return ''
    const cls = f !== 'req' && (isLiveId(f) || isLiveId(to)) ? 'live' : ''
    if (dir === 'h'){ const x1=a.l+a.w, y1=a.t+a.h/2, x2=b.l, y2=b.t+b.h/2, mx=(x1+x2)/2; return `<path class="${cls}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>` }
    const x1=a.l+a.w/2, y1=a.t+a.h, x2=b.l+b.w/2, y2=b.t, my=(y1+y2)/2
    return `<path class="${cls}" d="M${x1},${y1} L${x1},${my} L${x2},${my} L${x2},${y2}"/>`
  }).join('')
}

// ---------- Zoom, déplacement du plan, Ajuster ----------
function applyCam(){ world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.k})`; document.getElementById('zoom-val').textContent = Math.round(cam.k*100) + ' %' }
function zoomAt(f, sx, sy){ const k = Math.min(2, Math.max(0.25, cam.k*f)); cam.x = sx - (sx-cam.x)*(k/cam.k); cam.y = sy - (sy-cam.y)*(k/cam.k); cam.k = k; applyCam() }
function fit(){
  const r = stage.getBoundingClientRect(), w = world.offsetWidth, h = world.offsetHeight; if (!w || !h) return
  const k = Math.min(1.2, Math.max(0.25, Math.min((r.width-40)/w, (r.height-80)/h)))
  cam.k = k; cam.x = (r.width - w*k)/2; cam.y = Math.max(44, (r.height - h*k)/2); applyCam()
}
stage.addEventListener('wheel', e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)), e.clientX-r.left, e.clientY-r.top) }, { passive:false })
document.getElementById('zoom-in').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1.2, r.width/2, r.height/2) }
document.getElementById('zoom-out').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1/1.2, r.width/2, r.height/2) }
document.getElementById('fit').onclick = fit

// ---------- Glisser une bulle ou le plan ; clic = ouvrir et choisir l'agent du chat ----------
let drag = null
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('.hud, .legend, .topleft, .detail')) return
  const c = e.target.closest('.card')
  if (c){ const key = sessionId + ':' + layout + ':' + c.dataset.id, o = offsets[key] || [0,0]; drag = { kind:'card', c, key, x:e.clientX, y:e.clientY, ox:o[0], oy:o[1], moved:false } }
  else drag = { kind:'pan', x:e.clientX, y:e.clientY, ox:cam.x, oy:cam.y, moved:false }
  stage.setPointerCapture(e.pointerId)
})
stage.addEventListener('pointermove', e => {
  if (!drag) return
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y
  if (!drag.moved && Math.abs(dx)+Math.abs(dy) < 5) return
  drag.moved = true
  if (drag.kind === 'pan'){ stage.classList.add('panning'); cam.x = drag.ox+dx; cam.y = drag.oy+dy; applyCam(); return }
  drag.c.classList.add('dragging')
  const nx = drag.ox + dx/cam.k, ny = drag.oy + dy/cam.k
  offsets[drag.key] = [nx, ny]; drag.c.style.transform = `translate(${nx}px,${ny}px)`; drawLinks()
})
stage.addEventListener('pointerup', () => {
  if (!drag) return
  stage.classList.remove('panning')
  const d = drag; drag = null
  if (d.moved){ if (d.kind === 'card'){ d.c.classList.remove('dragging'); store.set('offsets', offsets); render(true) } return }
  if (d.kind === 'card'){ const id = d.c.dataset.id; sel = sel === id ? null : id; popId = id; render(true); popId = null }
})
document.getElementById('reset').onclick = () => {
  const prefix = sessionId + ':' + layout + ':'
  Object.keys(offsets).filter(k => k.startsWith(prefix)).forEach(k => delete offsets[k]); store.set('offsets', offsets)
  world.querySelectorAll('.card').forEach(c => c.style.transform = '')
  const t0 = performance.now(); const follow = () => { drawLinks(); if (performance.now()-t0 < 320) requestAnimationFrame(follow); else render(true) }; follow()
}

// ---------- Progression du projet ----------
function renderProject(n){
  const el = document.getElementById('proj')
  const steps = n ? (n.main.tasks || []) : []
  const done = steps.filter(x => x.status === 'completed').length
  const p = steps.length ? Math.round(done / steps.length * 100) : null
  const col = s => s === 'completed' ? 'var(--s-done)' : s === 'in_progress' ? 'var(--s-run)' : 'var(--idle)'
  el.title = steps.map(x => `${x.content} · ${t(x.status==='completed'?'tDone':x.status==='in_progress'?'tNow':'tTodo')}`).join('\n')
  el.innerHTML = `<span class="lbl">${esc(t('project'))}</span>${bar(p)}<span class="dots">${steps.map(x => `<i title="${esc(x.content)}" style="background:${col(x.status)}"></i>`).join('')}</span>`
}

// ---------- Chat ----------
function target(){ const n = nodes(); if (!n) return null; const id = sel && (sel === MAIN || n.subs.some(a => a.id === sel)) ? sel : MAIN
  return { id, name: id === MAIN ? t('mainAgent') : n.subs.find(a => a.id === id).description } }
let lastChatSig = ''
function renderChat(){
  const tg = target(), s = session()
  document.getElementById('who').textContent = tg ? tg.name : '—'
  const box = document.getElementById('msgs')
  const msgs = tg && s ? (s.chat || []).filter(m => m.agentId === tg.id) : []
  pending = pending.filter(p => !(s && (s.chat || []).some(m => m.id === p.id)))
  const all = [...msgs, ...pending.filter(p => tg && p.agentId === tg.id)]
  const sig = JSON.stringify(all) + lang
  if (sig === lastChatSig) return
  lastChatSig = sig
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 30
  box.innerHTML = all.length ? all.map(m => `<div class="m ${m.from==='user'?'u':'a'} ${m.status==='failed'?'failed':''}">${esc(m.text)}${m.from==='user'
    ? `<span class="st">${esc(t(m.status==='failed'?'mFailed':m.status==='sent'?'mSent':m.status==='queued'?'mQueued':'mSending'))}${m.reason?' · '+esc(m.reason.slice(0,140)):''}</span>` : ''}</div>`).join('')
    : `<div class="none">${esc(t('noMsgs'))}</div>`
  if (atBottom) box.scrollTop = box.scrollHeight
}
document.getElementById('form').onsubmit = async e => {
  e.preventDefault()
  const input = document.getElementById('input'), err = document.getElementById('err'), text = input.value.trim(), tg = target()
  err.textContent = ''
  if (!text){ err.textContent = t('emptyMsg'); return }
  if (!tg) return
  try {
    const res = await fetch('/chat', { method:'POST', headers:{ 'content-type':'application/json; charset=utf-8', 'x-agent-viewer':'1' },
      body: JSON.stringify({ sessionId, agentId: tg.id, text }) })
    if (!res.ok) throw new Error(await res.text())
    const { id } = await res.json()
    pending.push({ id, agentId: tg.id, from:'user', text, at: Date.now() })
    input.value = ''; renderChat()
  } catch (x){ err.textContent = t('sendFail') + (x && x.message || x) }
}
document.getElementById('input').addEventListener('input', () => { document.getElementById('err').textContent = '' })

// ---------- Sessions ----------
function renderSessions(){
  const box = document.getElementById('session'), list = payload.sessions
  if (!list.some(s => s.id === sessionId)){
    const live = list.filter(s => s.isLive).sort((a, b) => b.lastSeen - a.lastSeen)
    sessionId = (live[0] || list[0] || {}).id || null; needFit = true; sel = null
  }
  const html = list.map(s => `<option value="${esc(s.id)}" ${s.id===sessionId?'selected':''}>${s.isLive?'● ':'○ '}${esc(s.title || (s.cwd||'').split(/[\\/]/).pop() || s.id.slice(0,8))}${s.isLive?'':' ('+esc(t('inactive'))+')'}</option>`).join('')
  if (box.dataset.html !== html){ box.innerHTML = html; box.dataset.html = html }
  box.style.display = list.length ? '' : 'none'
  const s = session(); document.getElementById('live').classList.toggle('on', !!(s && s.isLive))
}
document.getElementById('session').onchange = e => { sessionId = e.target.value; store.set('session', sessionId); sel = null; needFit = true; render(true) }

// ---------- Menu Réglages ----------
const menu = document.getElementById('menu'), gear = document.getElementById('gear')
gear.onclick = () => { menu.classList.toggle('open'); gear.classList.toggle('on', menu.classList.contains('open')) }
document.addEventListener('pointerdown', e => { if (!e.target.closest('#menu, #gear')){ menu.classList.remove('open'); gear.classList.remove('on') } })
function syncMenu(){
  document.querySelectorAll('[data-opt="layout"] button').forEach(b => b.classList.toggle('on', b.dataset.val === layout))
  document.querySelectorAll('[data-opt="theme"] button').forEach(b => b.classList.toggle('on', b.dataset.val === theme))
  document.querySelectorAll('[data-opt="lang"] button').forEach(b => b.classList.toggle('on', b.dataset.val === lang))
  document.documentElement.classList.toggle('light', theme === 'clair')
}
document.querySelectorAll('[data-opt="layout"] button').forEach(b => b.onclick = () => { layout = b.dataset.val; store.set('layout', layout); syncMenu(); needFit = true; render(true) })
document.querySelectorAll('[data-opt="theme"] button').forEach(b => b.onclick = () => { theme = b.dataset.val; store.set('theme', theme); syncMenu() })
document.querySelectorAll('[data-opt="lang"] button').forEach(b => b.onclick = () => { lang = b.dataset.val; store.set('lang', lang); syncMenu(); applyTexts(); document.getElementById('session').dataset.html = ''; renderSessions(); lastChatSig = ''; render(true); setConn() })

// ---------- Agrandir le chat ----------
const chatEl = document.getElementById('chat'), grip = document.getElementById('grip')
function setChatHeight(h){ if (h == null){ chatEl.style.height = ''; chatEl.classList.remove('sized'); return }
  chatEl.style.height = Math.round(Math.min(window.innerHeight*0.75, Math.max(150, h))) + 'px'; chatEl.classList.add('sized') }
setChatHeight(store.get('chatH', null))
let rs = null
grip.addEventListener('pointerdown', e => { rs = { y:e.clientY, h:chatEl.offsetHeight }; grip.setPointerCapture(e.pointerId); chatEl.classList.add('resizing') })
grip.addEventListener('pointermove', e => { if (!rs) return; setChatHeight(rs.h - (e.clientY - rs.y)); drawLinks() })
grip.addEventListener('pointerup', () => { if (!rs) return; rs = null; chatEl.classList.remove('resizing'); store.set('chatH', chatEl.classList.contains('sized') ? chatEl.offsetHeight : null) })
grip.addEventListener('dblclick', () => { setChatHeight(null); store.set('chatH', null) })

// ---------- Flux en direct ----------
function setConn(){ document.getElementById('conn').textContent = connected ? t('live') : t('reconnect') }
function connect(){
  const es = new EventSource('/events')
  es.onopen = () => { connected = true; setConn() }
  es.onmessage = ev => { try { payload = JSON.parse(ev.data) } catch { return } if (!Array.isArray(payload.sessions)) payload.sessions = []; renderSessions(); render() }
  es.onerror = () => { connected = false; setConn(); render() }
}
window.addEventListener('resize', drawLinks)
// ---------- Appli installable ----------
let installEvt = null
const installBtn = document.getElementById('install'), installHint = document.getElementById('install-hint')
function syncInstall(){
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
  installBtn.hidden = !installEvt || standalone
  installHint.textContent = standalone ? t('installed') : installEvt ? '' : t('installHint')
}
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; syncInstall() })
addEventListener('appinstalled', () => { installEvt = null; syncInstall() })
installBtn.onclick = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice } catch {} installEvt = null; syncInstall() }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {})

applyTexts(); syncMenu(); setConn(); render(true); connect()
</script>
